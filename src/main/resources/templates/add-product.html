<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление продукта в запас</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrapper">
    <div th:replace="~{fragments/header :: nav-menu(activePage='products')}"></div>

    <div class="container">
        <h2>Добавление продукта в запас</h2>

        <div th:if="${param.success}" class="success-msg">
            Информация о партии продукта успешно сохранена!
        </div>

        <form th:action="@{/products/add}" th:object="${productForm}" method="post">

            <div class="form-group">
                <label for="productInfoId">Продукт (из справочника):</label>
                <select id="productInfoId" th:field="*{productInfoId}" class="form-control" required>
                    <option value="">Выберите продукт...</option>
                    <option th:each="info : ${productInfos}"
                            th:value="${info.id}"
                            th:text="${info.name}">Название продукта
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('productInfoId')}" th:errors="*{productInfoId}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label for="quantity">Количество:</label>
                <input type="number" step="0.1" id="quantity" th:field="*{quantity}" class="form-control" required>
                <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label for="expiryDate">Срок годности:</label>
                <input type="date" id="expiryDate" th:field="*{expiryDate}" class="form-control" required>
                <div th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}" class="field-error"></div>
            </div>

            <button type="submit" class="btn-submit">Сохранить</button>
            <a th:href="@{/products}" class="btn-cancel">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
