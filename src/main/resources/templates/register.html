<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Учет продуктов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>Регистрация</h2>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" required autofocus>
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></div>
            </div>

            <button type="submit" class="btn-submit">Зарегистрироваться</button>
            <a th:href="@{/login}" class="btn-cancel">Уже есть аккаунт</a>
        </form>
    </div>
</div>
</body>
</html>
