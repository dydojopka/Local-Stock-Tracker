<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Списки покупок</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-wrapper">
    <div th:replace="~{fragments/header :: nav-menu(activePage='shopping')}"></div>

    <div class="container">
        <h2>Списки покупок</h2>

        <div th:if="${param.success != null}" class="success-msg">Список покупок успешно сгенерирован!</div>
        <div th:if="${param.notNeeded != null}" class="info-msg">Запасы в норме, генерация не требуется.</div>
        <div th:if="${param.deleted != null}" class="delete-msg">Список успешно удален.</div>

        <form th:action="@{/shopping/generate}" method="post" style="margin-bottom: 20px;">
            <button type="submit" class="btn" id="create-list">Сгенерировать новый список</button>
        </form>

        <div th:if="${#lists.isEmpty(shoppingLists)}">
            <p style="color: #777;">У вас пока нет списков покупок.</p>
        </div>

        <div th:each="list : ${shoppingLists}" class="list-card" th:id="'list-' + ${list.id}">
            <h3>Список от <span th:text="${list.createdDate}"></span></h3>
            <p style="color: #666; font-size: 0.9em; margin-top: 0;">Статус:
                <span th:id="'status-' + ${list.id}"
                      th:text="${list.status}"
                      th:style="${list.status == 'Выполнен'} ? 'color: #28a745; font-weight: bold;' : ''">
                </span>
            </p>

            <ul th:id="'items-' + ${list.id}" style="list-style-type: none; padding-left: 0;">
                <li th:each="item : ${list.items}" style="display: flex; align-items: center; margin-bottom: 8px;">
                    <input type="checkbox" class="item-checkbox"
                           th:checked="${item.isPurchased}"
                           th:onclick="'toggleItem(' + ${item.id} + ', this, ' + ${list.id} + ')'"/>

                    <span th:id="'item-text-' + ${item.id}"
                          th:classappend="${item.isPurchased} ? 'purchased-text' : ''">
                        <strong th:text="${item.productInfo.name}">Наименование</strong> - купить: <span
                            th:text="${item.targetQuantity}">0</span> шт.
                    </span>
                </li>
            </ul>

            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <button type="button" class="action-btn btn-copy" th:onclick="'copyList(' + ${list.id} + ')'">
                    📋 Скопировать
                </button>
                <button type="button" class="action-btn btn-download" th:onclick="'downloadList(' + ${list.id} + ')'">
                    ⬇️ Скачать
                </button>

                <form th:action="@{/shopping/delete/{id}(id=${list.id})}" method="post"
                      style="display:inline-block; margin-left: 15px;">
                    <button type="submit" class="action-btn btn-delete"
                            onclick="return confirm('Вы уверены, что хотите удалить этот список?');">🗑️ Удалить
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>

<script>
    // Вспомогательная функция для формирования красивого текста списка
    function getListText(listId) {
        const listCard = document.getElementById('list-' + listId);
        let text = listCard.querySelector('h3').innerText + '\n';
        text += '-----------------------\n';

        const items = document.getElementById('items-' + listId).querySelectorAll('li');
        items.forEach(item => {
            // Очищаем текст от лишних отступов
            let itemText = item.innerText.replace(/\s+/g, ' ').trim();
            text += '- ' + itemText + '\n';
        });
        return text;
    }

    // Функция копирования в буфер обмена
    function copyList(listId) {
        const text = getListText(listId);
        navigator.clipboard.writeText(text).then(() => {
            alert('Список скопирован в буфер обмена!');
        }).catch(err => {
            console.error('Ошибка копирования: ', err);
            alert('Не удалось скопировать список.');
        });
    }

    // Функция скачивания .txt файла
    function downloadList(listId) {
        const text = getListText(listId);
        // Создаем виртуальный файл (Blob) в памяти браузера
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        // Создаем невидимую ссылку
        const a = document.createElement('a');
        a.href = url;
        // Задаем имя скачиваемого файла (например, list_2023-10-25.txt)
        const dateStr = new Date().toISOString().slice(0, 10);
        a.download = 'Список_покупок_' + dateStr + '.txt';

        document.body.appendChild(a);
        a.click();

        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Функция отправки состояния чекбокса на сервер
    function toggleItem(itemId, checkboxElem, listId) {
        const isPurchased = checkboxElem.checked;

        // Отправляем тихий запрос на сервер
        fetch(`/shopping/toggle-item/${itemId}?purchased=${isPurchased}`, {
            method: 'POST'
        }).then(response => {
            if(response.ok) {
                // Визуально зачеркиваем текст
                const textSpan = document.getElementById('item-text-' + itemId);
                if (isPurchased) {
                    textSpan.classList.add('purchased-text');
                } else {
                    textSpan.classList.remove('purchased-text');
                }
                // Проверяем, не выполнен ли теперь весь список
                checkAllPurchased(listId);
            } else {
                alert("Ошибка соединения с сервером");
                checkboxElem.checked = !isPurchased; // Возвращаем чекбокс обратно в случае ошибки
            }
        });
    }

    // Проверка всех галочек и изменение статуса "Выполнен" на лету
    function checkAllPurchased(listId) {
        const listCard = document.getElementById('list-' + listId);
        const checkboxes = listCard.querySelectorAll('.item-checkbox');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);

        const statusSpan = document.getElementById('status-' + listId);
        if (allChecked) {
            statusSpan.innerText = "Выполнен";
            statusSpan.style.color = "#28a745";
            statusSpan.style.fontWeight = "bold";
        } else {
            statusSpan.innerText = "Активен";
            statusSpan.style.color = "#666";
            statusSpan.style.fontWeight = "normal";
        }
    }
</script>

</body>
</html>
