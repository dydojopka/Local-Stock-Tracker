<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Справочник продуктов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrapper">
    <div th:replace="~{fragments/header :: nav-menu(activePage='directory')}"></div>

    <div class="container">
        <h2>Справочник продуктов</h2>

        <div th:if="${param.error != null and param.error[0] == 'negative'}"
             style="color: red; margin-bottom: 15px; font-weight: bold;">
            Ошибка: Минимальное количество не может быть отрицательным!
        </div>
        <div th:if="${param.error != null and param.error[0] == 'duplicate_barcode'}"
             style="color: red; margin-bottom: 15px; font-weight: bold;">
            Ошибка: Продукт с таким штрих-кодом уже зарегистрирован!
        </div>
        <div th:if="${param.success != null}" style="color: green; margin-bottom: 15px; font-weight: bold;">
            Продукт успешно добавлен в справочник.
        </div>

        <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd;">
            <h3>Добавить продукт в справочник</h3>
            <form th:action="@{/directory/add}" th:object="${productInfoForm}" method="post">
                <div class="form-group">
                    <label for="name">Название продукта:</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="barcode">Штрихкод:</label>
                    <input type="text" id="barcode" th:field="*{barcode}" class="form-control">
                    <div th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="minQuantity">Минимальный остаток:</label>
                    <input type="number" step="0.1" min="0" id="minQuantity" th:field="*{minQuantity}" class="form-control"
                           required>
                    <div th:if="${#fields.hasErrors('minQuantity')}" th:errors="*{minQuantity}" class="field-error"></div>
                </div>

                <div class="form-group">
                    <label for="categoryId">Категория:</label>
                    <select id="categoryId" th:field="*{categoryId}" class="form-control" required>
                        <option value="">Выберите категорию...</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">Категория
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="field-error"></div>
                </div>
                <button type="submit" class="btn-submit">Сохранить</button>
            </form>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Категория</th>
                <th style="width: 100px; text-align: center;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(productInfos)}">
                <td colspan="4" style="text-align: center;">Справочник пуст. Добавьте первый продукт!</td>
            </tr>
            <tr th:each="info : ${productInfos}">
                <td th:text="${info.id}"></td>
                <td th:text="${info.name}"></td>
                <td th:text="${info.category != null ? info.category.name : 'Без категории'}"></td>
                <td style="text-align: center;">
                    <form th:action="@{/directory/delete}" method="post" style="display: inline;">
                        <input type="hidden" name="id" th:value="${info.id}">
                        <button type="submit" class="action-btn btn-delete"
                                onclick="return confirm('Удалить этот продукт из справочника?');">Удалить
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
