<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="nav-menu(activePage)" class="nav-menu">

    <a th:href="@{/}"
       th:classappend="${activePage == '' || activePage == 'home'} ? 'active' : ''"
    >🏠 Главная</a>

    <a th:href="@{/products}"
       th:classappend="${activePage == 'products'} ? 'active' : ''"
    >📦 Мой склад</a>

    <a th:href="@{/shopping}"
       th:classappend="${activePage == 'shopping'} ? 'active' : ''"
    >🛒 Списки покупок</a>

    <a th:href="@{/notifications}"
       th:classappend="${activePage == 'notifications'} ? 'active' : ''"
    >⚠️ Уведомления</a>

    <a th:href="@{/categories}"
       th:classappend="${activePage == 'categories'} ? 'active' : ''"
    >🏷️ Категории</a>

    <a th:href="@{/directory}"
       th:classappend="${activePage == 'directory'} ? 'active' : ''"
    >🗂️ Продукты</a>

    <a th:href="@{/catalog}"
       th:classappend="${activePage == 'catalog'} ? 'active' : ''"
    >⚙️ Остатки</a>

    <div class="nav-auth" sec:authorize="isAuthenticated()">
        <div class="nav-user">
            <span>Пользователь</span>
            <strong sec:authentication="name">user</strong>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Выйти</button>
        </form>
    </div>

    <div class="nav-auth" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}">Войти</a>
        <a th:href="@{/register}">Регистрация</a>
    </div>

</div>

</body>
</html>
