<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="nav-menu(activePage)" class="nav-menu">

    <a th:href="@{/}"
       th:classappend="${activePage == '' || activePage == 'home'} ? 'active' : ''"
    >🏠 Главная</a>

    <a th:href="@{/products}"
       th:classappend="${activePage == 'products'} ? 'active' : ''"
    >📦 Мой склад</a>

    <a th:href="@{/shopping}"
       th:classappend="${activePage == 'shopping'} ? 'active' : ''"
    >🛒 Списки покупок</a>

    <a th:href="@{/notifications}"
       th:classappend="${activePage == 'notifications'} ? 'active' : ''"
    >⚠️ Уведомления</a>

    <a th:href="@{/categories}"
       th:classappend="${activePage == 'categories'} ? 'active' : ''"
    >🏷️ Категории</a>

    <a th:href="@{/directory}"
       th:classappend="${activePage == 'directory'} ? 'active' : ''"
    >🗂️ Продукты</a>

    <a th:href="@{/catalog}"
       th:classappend="${activePage == 'catalog'} ? 'active' : ''"
    >⚙️ Остатки</a>

</div>

</body>
</html>
