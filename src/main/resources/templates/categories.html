<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Справочник категорий</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrapper">
    <div th:replace="~{fragments/header :: nav-menu(activePage='categories')}"></div>

    <div class="container">
        <h2>Справочник категорий</h2>

        <div th:if="${param.error}" class="error-msg">
            Ошибка: Категория с таким названием уже существует!
        </div>
        <div th:if="${param.deleteError != null and param.deleteError[0] == 'in_use'}" class="error-msg">
            Категорию нельзя удалить: к ней привязаны продукты из справочника.
        </div>
        <div th:if="${param.deleteError != null and param.deleteError[0] == 'not_found'}" class="error-msg">
            Категория не найдена.
        </div>
        <div th:if="${param.deleted != null}" class="success-msg">
            Категория удалена.
        </div>

        <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd;">
            <h3>Добавить категорию</h3>
            <form th:action="@{/categories/add}" method="post">
                <div class="form-group">
                    <label for="name">Название:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="description">Описание:</label>
                    <input type="text" id="description" name="description" class="form-control">
                </div>
                <button type="submit" class="btn-submit">Сохранить</button>
            </form>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th style="width: 100px; text-align: center;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="4" style="text-align: center;">Категории пока не добавлены.</td>
            </tr>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}"></td>
                <td th:text="${category.name}"></td>
                <td th:text="${category.description}"></td>
                <td style="text-align: center;">
                    <form th:action="@{/categories/delete}" method="post" style="display: inline;">
                        <input type="hidden" name="id" th:value="${category.id}">
                        <button type="submit" class="action-btn btn-delete"
                                onclick="return confirm('Вы уверены, что хотите удалить эту категорию?');">
                            Удалить
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
