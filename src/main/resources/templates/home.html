<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель управления - Учет продуктов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="~{fragments/header :: nav-menu(${activePage})}"></div>

    <div class="container">

        <div class="page-header">
            <h2>Панель управления запасами</h2>
            <p class="subtitle">Оперативная аналитика состояния вашего склада</p>
        </div>

        <div class="dashboard-grid">
            <div class="kpi-card">
                <div class="kpi-title">Всего партий</div>
                <div class="kpi-value" th:text="${totalProducts}">0</div>
            </div>

            <div class="kpi-card expired">
                <div class="kpi-title">Просрочено</div>
                <div class="kpi-value" th:text="${expiredCount}">0</div>
            </div>

            <div class="kpi-card low-stock">
                <div class="kpi-title">Заканчиваются</div>
                <div class="kpi-value" th:text="${lowStockCount}">0</div>
            </div>

            <div class="kpi-card lists">
                <div class="kpi-title">Активные списки</div>
                <div class="kpi-value" th:text="${activeListsCount}">0</div>
            </div>

            <div class="kpi-card health">
                <div class="kpi-title">Здоровье склада</div>
                <div class="kpi-value" th:text="${healthScore} + '%'">100%</div>
            </div>
        </div>

        <div class="dashboard-charts-container" style="display: flex; gap: 20px; margin-top: 2rem; flex-wrap: wrap;">
            <div class="chart-card"
                 style="flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <canvas id="categoryChart"></canvas>
            </div>

            <div class="chart-card"
                 style="flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <canvas id="expiryChart"></canvas>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title fw-bold text-secondary mb-3">Динамика списания продуктов (последние 7 дней)</h4>
                        <div style="position: relative; height: 320px;">
                            <canvas id="disposalLineChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    async function loadDashboardCharts() {
        const response = await fetch('/api/dashboard/stats', {
            headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
            throw new Error('Не удалось загрузить данные графиков');
        }

        const dashboard = await response.json();
        renderCategoryChart(dashboard.categoryChart);
        renderExpiryChart(dashboard.expiryChart);
        renderDisposalChart(dashboard.disposalChart);
    }

    function renderCategoryChart(chartData) {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: chartData.labels,
                datasets: [{
                    label: 'Кол-во',
                    data: chartData.data,
                    backgroundColor: ['#4caf50', '#2196f3', '#ff9800', '#f44336', '#9c27b0', '#00bcd4', '#ffc107'],
                    hoverOffset: 4
                }]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' },
                    title: { display: true, text: 'Запасы по категориям', font: { size: 18 } },
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold' },
                        formatter: (value, ctx) => {
                            const dataArr = ctx.chart.data.datasets[0].data;
                            const sum = dataArr.reduce((total, item) => total + Number(item), 0);
                            return sum > 0 ? (Number(value) * 100 / sum).toFixed(1) + '%' : '';
                        }
                    }
                }
            }
        });
    }

    function renderExpiryChart(chartData) {
        const expDataValues = chartData.data;
        const maxExpValue = Math.max(...expDataValues, 1);
        const expiryColors = expDataValues.map(value => {
            const ratio = value / maxExpValue;
            const hue = ratio * 30;
            return `hsl(${hue}, 100%, 50%)`;
        });

        const ctxExpiry = document.getElementById('expiryChart').getContext('2d');
        new Chart(ctxExpiry, {
            type: 'bar',
            data: {
                labels: chartData.labels,
                datasets: [{
                    label: 'Дней осталось',
                    data: expDataValues,
                    backgroundColor: expiryColors,
                    borderRadius: 4,
                    minBarLength: 3
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Ближайшие сроки годности (Топ-5)',
                        font: { size: 18 }
                    },
                    datalabels: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        title: { display: true, text: 'Осталось дней' }
                    }
                }
            }
        });
    }

    function renderDisposalChart(chartData) {
        const ctxLine = document.getElementById('disposalLineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: [
                    {
                        label: 'Использовано',
                        data: chartData.consumedData,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.05)',
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: '#0d6efd',
                        pointHoverRadius: 7,
                        fill: true
                    },
                    {
                        label: 'Просрочено',
                        data: chartData.expiredData,
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.05)',
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: '#dc3545',
                        pointHoverRadius: 7,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            boxWidth: 12,
                            font: { size: 13 }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1 },
                        grid: { color: 'rgba(0, 0, 0, 0.05)' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadDashboardCharts().catch(error => console.error(error));
    });
</script>
</body>
</html>
