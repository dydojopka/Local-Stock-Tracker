<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель управления - Учет продуктов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="~{fragments/header :: nav-menu(${activePage})}"></div>

    <div class="container">

        <div class="page-header">
            <h2>Панель управления запасами</h2>
            <p class="subtitle">Оперативная аналитика состояния вашего склада</p>
        </div>

        <div class="dashboard-grid">
            <div class="kpi-card">
                <div class="kpi-title">Всего партий</div>
                <div class="kpi-value" th:text="${totalProducts}">0</div>
            </div>

            <div class="kpi-card expired">
                <div class="kpi-title">Просрочено</div>
                <div class="kpi-value" th:text="${expiredCount}">0</div>
            </div>

            <div class="kpi-card low-stock">
                <div class="kpi-title">Заканчиваются</div>
                <div class="kpi-value" th:text="${lowStockCount}">0</div>
            </div>

            <div class="kpi-card lists">
                <div class="kpi-title">Активные списки</div>
                <div class="kpi-value" th:text="${activeListsCount}">0</div>
            </div>

            <div class="kpi-card health">
                <div class="kpi-title">Здоровье склада</div>
                <div class="kpi-value" th:text="${healthScore} + '%'">100%</div>
            </div>
        </div>

        <div class="dashboard-charts-container" style="display: flex; gap: 20px; margin-top: 2rem; flex-wrap: wrap;">
            <div class="chart-card"
                 style="flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <canvas id="categoryChart"></canvas>
            </div>

            <div class="chart-card"
                 style="flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <canvas id="expiryChart"></canvas>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title fw-bold text-secondary mb-3">Динамика списания продуктов (последние 7 дней)</h4>
                        <div style="position: relative; height: 320px;">
                            <canvas id="disposalLineChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const labels = /*[[${categoryLabels}]]*/ [];
    const dataValues = /*[[${categoryData}]]*/ [];

    const ctx = document.getElementById('categoryChart').getContext('2d');
    const categoryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                label: 'Кол-во',
                data: dataValues,
                backgroundColor: ['#4caf50', '#2196f3', '#ff9800', '#f44336', '#9c27b0', '#00bcd4', '#ffc107'],
                hoverOffset: 4
            }]
        },
        // Подключаем плагин
        plugins: [ChartDataLabels],
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' },
                title: { display: true, text: 'Запасы по категориям', font: { size: 18 } },
                // Настройка вывода процентов
                datalabels: {
                    color: '#fff',
                    font: { weight: 'bold' },
                    formatter: (value, ctx) => {
                        let sum = 0;
                        let dataArr = ctx.chart.data.datasets[0].data;
                        dataArr.map(data => { sum += data; });
                        let percentage = (value * 100 / sum).toFixed(1) + "%";
                        return percentage;
                    }
                }
            }
        }
    });

// --- ГРАФИК 2: СРОКИ ГОДНОСТИ (ИСПРАВЛЕННЫЙ) ---
const expLabels = /*[[${expiryLabels}]]*/ [];
const expDataValues = /*[[${expiryData}]]*/ [];

// Максимальное значение для расчёта оттенка (не меньше 1)
const maxExpValue = Math.max(...expDataValues, 1);

// Генерируем цвета: красный (0 дней) -> оранжевый (max дней)
const expiryColors = expDataValues.map(value => {
    const ratio = value / maxExpValue;      // 0 (близко к концу) ... 1 (много дней)
    const hue = ratio * 30;                // 0° (красный) -> 30° (оранжевый)
    return `hsl(${hue}, 100%, 50%)`;
});

const ctxExpiry = document.getElementById('expiryChart').getContext('2d');
const expiryChart = new Chart(ctxExpiry, {
    type: 'bar',
    data: {
        labels: expLabels,
        datasets: [{
            label: 'Дней осталось',
            data: expDataValues,
            backgroundColor: expiryColors,     // ← индивидуальные цвета столбцов
            borderRadius: 4,
            minBarLength: 3                    // ← столбец со значением 0 тоже виден
        }]
    },
    options: {
        indexAxis: 'y',
        responsive: true,
        plugins: {
            legend: { display: false },
            title: {
                display: true,
                text: 'Ближайшие сроки годности (Топ-5)',
                font: { size: 18 }
            },
            datalabels: {
                display: false
            }
        },
        scales: {
            x: {
                beginAtZero: true,
                title: { display: true, text: 'Осталось дней' }
            }
        }
    }
});
// Настройка линейного графика динамики списания
const ctxLine = document.getElementById('disposalLineChart').getContext('2d');
new Chart(ctxLine, {
    type: 'line',
    data: {
        labels: [[${lineChartLabels}]],
        datasets: [
            {
                label: 'Использовано',
                data: [[${consumedData}]],
                borderColor: '#0d6efd',       // Красивый синий Bootstrap цвет
                backgroundColor: 'rgba(13, 110, 253, 0.05)', // Легкая синяя заливка под линией
                tension: 0.3,                 // Эффект сглаживания (кривая вместо ломаной)
                pointRadius: 5,               // Размер точек
                pointBackgroundColor: '#0d6efd',
                pointHoverRadius: 7,          // Увеличение точки при наведении
                fill: true
            },
            {
                label: 'Просрочено',
                data: [[${expiredData}]],
                borderColor: '#dc3545',       // Насыщенный красный цвет
                backgroundColor: 'rgba(220, 53, 69, 0.05)',  // Легкая красная заливка под линией
                tension: 0.3,                 // Эффект сглаживания
                pointRadius: 5,               // Размер точек
                pointBackgroundColor: '#dc3545',
                pointHoverRadius: 7,          // Увеличение точки при наведении
                fill: true
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    boxWidth: 12,
                    font: { size: 13 }
                }
            }
        },
        scales: {
            y: {
                beginAtZero: true,
                ticks: {
                    stepSize: 1 // Так как продукты штучные, шаги на оси Y делаем целыми числами
                },
                grid: {
                    color: 'rgba(0, 0, 0, 0.05)' // Едва заметная сетка
                }
            },
            x: {
                grid: {
                    display: false // Убираем вертикальную сетку, чтобы график выглядел чище
                }
            }
        }
    }
});
    /*]]>*/
</script>
</body>
</html>
