<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - Учет продуктов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>Вход в систему</h2>

        <div th:if="${param.error}" class="error-msg">
            Неверное имя пользователя или пароль.
        </div>
        <div th:if="${param.logout}" class="success-msg">
            Вы успешно вышли из системы.
        </div>
        <div th:if="${param.registered}" class="success-msg">
            Регистрация завершена. Теперь можно войти.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn-submit">Войти</button>
            <a th:href="@{/register}" class="btn-cancel">Создать аккаунт</a>
        </form>
    </div>
</div>
</body>
</html>
